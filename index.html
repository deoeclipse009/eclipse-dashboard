<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#B7ADE0">
<link rel="manifest" href="manifest.json">
<title>Dashboard</title>
<style>
  :root{
    --base:#B7ADE0; --c1:#8F7FD0; --c2:#E6DFF3; --c3:#C99AC4; --ink:#1d1838;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(12px,1.55vh,17px);height:100%}
  body{
    height:100%;overflow:hidden;color:var(--ink);background:var(--base);
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
    font-weight:300;-webkit-font-smoothing:antialiased;
    --line:color-mix(in srgb,var(--ink) 30%,transparent);
    --soft:color-mix(in srgb,var(--ink) 62%,transparent);
  }
  button,input{font:inherit;color:inherit;background:none;border:0;outline:0}
  button{cursor:pointer}
  :focus-visible{outline:1px solid var(--ink);outline-offset:3px;border-radius:3px}

  /* ---------- background: drifting gradient + grain ---------- */
  .bg{position:fixed;inset:0;overflow:hidden;background:var(--base);transition:opacity .45s ease;--mx:50%;--my:38%}
  .blur-field{position:absolute;inset:-10%;filter:blur(min(9vw,120px));transform:translateZ(0)}
  .blob{position:absolute;border-radius:50%;opacity:.85;transition:transform 1.8s cubic-bezier(.2,.6,.2,1)}
  .b1{width:60vw;height:60vw;left:-12vw;top:-14vw;background:var(--c1);transform:translate(calc((var(--mx) - 50%) * .03),calc((var(--my) - 50%) * .03))}
  .b2{width:52vw;height:52vw;right:-14vw;top:4vh;background:var(--c3);transform:translate(calc((var(--mx) - 50%) * -.025),calc((var(--my) - 50%) * .02))}
  .b3{width:64vw;height:64vw;left:8vw;bottom:-30vw;background:var(--c2);opacity:.75;transform:translate(calc((var(--mx) - 50%) * .02),calc((var(--my) - 50%) * -.03))}
  .b4{width:44vw;height:44vw;right:6vw;bottom:-18vw;background:var(--c1);opacity:.55;transform:translate(calc((var(--mx) - 50%) * -.02),calc((var(--my) - 50%) * -.02))}
  .wash{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--base) 88%,transparent),transparent 60%)}
  .grain{position:absolute;inset:0;background-image:var(--grain);background-size:240px;opacity:.6;mix-blend-mode:overlay;pointer-events:none}
  .scrim{position:absolute;left:0;right:0;top:0;height:7rem;pointer-events:none;opacity:0;transition:opacity .45s ease;
    background:linear-gradient(to bottom,color-mix(in srgb,var(--ink) 56%,transparent) 0,color-mix(in srgb,var(--ink) 56%,transparent) 38px,transparent 100%)}
  body:not(.dark) .scrim{opacity:1}
  @media (prefers-reduced-motion:reduce){.blob{transition:none}}

  /* ---------- left rail ---------- */
  .cursor-glow{position:fixed;left:0;top:0;width:14px;height:14px;margin:-7px;border-radius:50%;background:color-mix(in srgb,var(--ink) 70%,transparent);pointer-events:none;z-index:999;mix-blend-mode:difference;transform:translate(-100px,-100px);transition:width .1s ease-out,height .1s ease-out,margin .1s ease-out,opacity .15s;opacity:.55;will-change:transform}
  .cursor-glow.hover{width:34px;height:34px;margin:-17px;opacity:.9}
  .cursor-glow.down{width:10px;height:10px;margin:-5px}
  @media (hover:none),(pointer:coarse){.cursor-glow{display:none}}
  .rail{position:fixed;left:clamp(14px,2vw,30px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:1.1rem;align-items:center}
  .rail button{width:1.9rem;height:1.9rem;display:grid;place-items:center;opacity:.5;transition:opacity .2s}
  .rail button:hover,.rail button.on{opacity:1}
  .rail svg{width:1.05rem;height:1.05rem;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
  .rail .pip{width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:.55;margin-bottom:.4rem}

  /* ---------- stage: hairline columns ---------- */
  .stage{
    position:fixed;left:clamp(64px,6vw,96px);right:4.5vw;top:9vh;bottom:8vh;
    display:grid;grid-template-columns:1fr 2fr 1.15fr 1.15fr;
  }
  .col{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;padding:0 clamp(14px,1.5vw,26px);border-left:1px solid var(--line)}
  .col:last-child{border-right:1px solid var(--line)}
  .lbl{font-size:.74rem;letter-spacing:.02em;color:var(--soft)}
  .hide-in-focus{transition:opacity .35s}
  body.focus .c3 > *, body.focus .c4 > *{opacity:0;pointer-events:none}

  /* per-section fold button */
  .fold{position:absolute;top:-.15rem;right:clamp(8px,.8vw,14px);width:1.5rem;height:1.5rem;display:grid;place-items:center;opacity:.3;transition:opacity .2s;z-index:2}
  .col:hover .fold,.fold:focus-visible{opacity:.75}
  .fold:hover{opacity:1 !important}
  .fold svg{width:.85rem;height:.85rem;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round}
  .fold .v{transition:opacity .2s}
  .col:not(.folded) .fold .v{opacity:0}
  .col > *:not(.fold){transition:opacity .3s ease}
  .col.folded > *:not(.fold){opacity:0;pointer-events:none;visibility:hidden;transition:opacity .3s ease,visibility 0s .3s}
  .col.folded .fold{opacity:.7}

  /* column 1: year + month grid */
  .year{font-size:.8rem;font-weight:400;letter-spacing:.02em}
  .cal{margin-top:auto;padding-bottom:.2rem}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem}
  .calhead button{width:1.6rem;height:1.6rem;opacity:.55;font-size:1.05rem;line-height:1}
  .calhead button:hover{opacity:1}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:.15rem;text-align:center;font-size:.8rem}
  .wd{font-weight:500;font-size:.72rem;padding-bottom:.55rem}
  .day{position:relative;height:1.85rem;border-radius:.4rem;font-weight:300;transition:background .2s}
  .day:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
  .item{border-radius:.5rem;transition:background .2s}
  .item:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
  .uprow{transition:background .2s;border-radius:.4rem}
  .uprow:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
  .day.today{background:var(--ink);color:var(--base);font-weight:500}
  .day.sel{box-shadow:inset 0 0 0 1px var(--ink)}
  .day.has::after{content:"";position:absolute;left:50%;bottom:.2rem;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:currentColor;opacity:.75}

  /* launcher (column 1, under the year) */
  .dock{margin-top:2.2rem}
  .dock h3{font-weight:400;font-size:.95rem;margin-bottom:.7rem}
  .dock .apps{display:flex;flex-wrap:wrap;gap:.4rem}
  .dock a{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;color:inherit;font-size:.82rem;transition:background .2s,border-color .2s}
  .dock .apps a{padding:.28rem .75rem;border:1px solid var(--line);border-radius:1rem}
  .dock .apps a:hover{border-color:var(--ink)}
  .dock .cmds{margin-top:.9rem;display:flex;flex-direction:column}
  .dock .cmds a{padding:.45rem .3rem;border-top:1px solid var(--line);border-radius:.4rem}
  .dock .cmds a:first-child{border-top:0}
  .dock .cmds a:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
  .dock .cmds a .dot{margin-left:auto}
  .dock .cmds a::before{content:">_";font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;color:var(--soft)}
  .dock .hint{font-size:.68rem;color:var(--soft);margin-top:.7rem;line-height:1.4}

  /* column 2: big date, month, clock */
  .c2{container-type:inline-size;overflow:hidden}
  .clock{margin-top:auto;max-width:100%;font-weight:100;line-height:.82;letter-spacing:-.03em;font-size:min(20vh,11vw,44cqw);white-space:nowrap;font-variant-numeric:tabular-nums}
  .clock small{font-size:.28em;font-weight:200;margin-left:.3rem;color:var(--soft);letter-spacing:0;font-variant-numeric:tabular-nums}
  .datestamp{margin-top:2.4vh;font-size:min(2.6vh,7.5cqw);font-weight:300;letter-spacing:.01em;color:var(--soft)}
  .datestamp .sep{margin:0 .55em;opacity:.6}
  .c2extra{margin-top:2.2vh;margin-bottom:auto;font-size:min(1.9vh,5.4cqw);line-height:1.45}
  .brief{color:var(--soft)}
  .brief b{font-weight:400;color:var(--ink)}
  .counts{margin-top:1.6vh;max-width:26em}
  .counts .lbl{display:block;margin-bottom:.35rem}
  .counts div.row{display:flex;justify-content:space-between;gap:1rem;padding:.3rem 0;border-top:1px solid var(--line);font-size:.88em}
  .counts div.row span:last-child{color:var(--soft);white-space:nowrap}
  .datestamp #daymonth{color:var(--ink)}

  /* column 3: to-do */
  .todo-head{display:flex;justify-content:space-between;align-items:baseline;padding-right:1.6rem}
  .tabs{display:flex;gap:1rem;margin:.9rem 0 1.1rem;font-size:.85rem}
  .tabs button{opacity:.5;padding-bottom:.25rem;border-bottom:1px solid transparent}
  .tabs button:hover{opacity:.85}
  .tabs button.on{opacity:1;border-bottom-color:var(--ink)}
  .list{flex:1;min-height:0;overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:.15rem}
  .list::-webkit-scrollbar{display:none}
  .item{display:flex;align-items:flex-start;gap:.7rem;padding:.42rem 0;position:relative}
  .chk{flex:none;width:.95rem;height:.95rem;margin-top:.18rem;border:1px solid var(--ink);border-radius:50%;position:relative;transition:background .2s}
  .item.done .chk{background:var(--ink)}
  .item.done .chk::after{content:"";position:absolute;left:.27rem;top:.12rem;width:.22rem;height:.42rem;border:solid var(--base);border-width:0 1.2px 1.2px 0;transform:rotate(40deg)}
  .body{flex:1;min-width:0;text-align:left;line-height:1.3;font-size:.95rem}
  .body .meta{display:block;font-size:.72rem;color:var(--soft);margin-top:.1rem}
  .item.done .body{opacity:.45;text-decoration:line-through;text-decoration-thickness:1px}
  .del{opacity:0;font-size:1rem;line-height:1;width:1.4rem;height:1.4rem;transition:opacity .2s}
  .item:hover .del,.del:focus-visible{opacity:.6}
  .del:hover{opacity:1 !important}
  .empty{font-size:.85rem;color:var(--soft);padding:.4rem 0}
  .add{border-top:1px solid var(--line);padding-top:.8rem;margin-top:.6rem}
  .add input.txt{width:100%;padding:.3rem 0;font-size:.95rem;border-bottom:1px solid transparent}
  .add input.txt::placeholder{color:var(--soft)}
  .add input.txt:focus{border-bottom-color:var(--line)}
  .addrow{display:flex;align-items:center;gap:.8rem;margin-top:.5rem;font-size:.78rem}
  .addrow .scope{color:var(--soft);padding:.1rem .5rem;border:1px solid var(--line);border-radius:1rem}
  .addrow .scope:hover{color:var(--ink);border-color:var(--ink)}
  .addrow input[type=date]{color:var(--soft);font-size:.78rem;min-width:0;flex:1;color-scheme:light}
  body.dark .addrow input[type=date]{color-scheme:dark}
  .addrow .go{margin-left:auto;font-size:1.1rem;line-height:1;opacity:.6}
  .addrow .go:hover{opacity:1}

  /* column 4: palette, upcoming, music */
  .palette{text-align:left;font-size:.74rem;line-height:1.5;color:var(--soft);align-self:flex-start}
  .palette:hover{color:var(--ink)}
  .palette b{font-weight:400;color:var(--ink)}
  .up{margin-top:5vh}
  .up h3{font-weight:400;font-size:.95rem;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.7rem}
  .up h3 button{font-size:.72rem;color:var(--soft)}
  .up h3 button:hover{color:var(--ink)}
  .uprow{display:flex;gap:.9rem;padding:.4rem 0;border-top:1px solid var(--line);font-size:.88rem;line-height:1.3}
  .uprow:first-of-type{border-top:0}
  .uprow .when{flex:none;width:4.6rem;color:var(--soft)}
  .music{margin-top:auto}
  .music .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6rem}
  .music .top button{font-size:.72rem;color:var(--soft)}
  .music .top button:hover{color:var(--ink)}
  .music iframe{display:block;width:100%;height:152px;border:0;border-radius:12px}
  .music input{width:100%;padding:.55rem 0;font-size:.9rem;border-bottom:1px solid var(--line)}
  .music input::placeholder{color:var(--soft)}
  .music .hint{font-size:.72rem;color:var(--soft);margin-top:.5rem;line-height:1.4}
  .np{display:flex;gap:.9rem;align-items:center;text-decoration:none;color:inherit;padding:.2rem 0}
  .np img{flex:none;width:5.2rem;height:5.2rem;border-radius:.6rem;object-fit:cover;box-shadow:0 .6rem 1.6rem -.6rem color-mix(in srgb,var(--ink) 55%,transparent);background:color-mix(in srgb,var(--ink) 12%,transparent)}
  .np .info{min-width:0;flex:1}
  .np .ttl{font-size:.95rem;font-weight:400;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .np .art{font-size:.8rem;color:var(--soft);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np .bar{height:2px;margin-top:.7rem;background:var(--line);border-radius:2px;overflow:hidden}
  .np .bar i{display:block;height:100%;width:0;background:var(--ink);opacity:.8}
  .np .state{font-size:.68rem;color:var(--soft);margin-top:.35rem;letter-spacing:.04em}
  .pill{padding:.3rem .8rem;border:1px solid var(--line);border-radius:1rem;font-size:.78rem;color:var(--ink)}
  .pill:hover{border-color:var(--ink)}
  .music .pill{margin-top:.6rem}
  .np-wrap .ctl{display:flex;align-items:center;gap:.3rem;margin-top:.5rem;margin-left:-.4rem}
  .np-wrap .ctl button{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;opacity:.65;transition:opacity .2s,background .2s}
  .np-wrap .ctl button:hover{opacity:1;background:color-mix(in srgb,var(--ink) 10%,transparent)}
  .np-wrap .ctl svg{width:1rem;height:1rem;fill:currentColor}
  .np-wrap .ctl .main{border:1px solid var(--line);opacity:.95}
  .dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:var(--line);margin-left:auto}
  .dot.on{background:#3fb06b;box-shadow:0 0 0 3px color-mix(in srgb,#3fb06b 25%,transparent)}
  .voice{position:fixed;left:50%;bottom:3.2vh;transform:translate(-50%,12px);max-width:min(38rem,88vw);padding:.7rem 1.1rem;border-radius:1.2rem;border:1px solid var(--line);background:color-mix(in srgb,var(--base) 78%,transparent);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);font-size:.9rem;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;display:flex;gap:.75rem;align-items:center}
  .voice.show{opacity:1;transform:translate(-50%,0)}
  .voice i{flex:none;width:.55rem;height:.55rem;border-radius:50%;background:var(--ink);opacity:.45}
  .voice.listening i{background:#e5484d;opacity:1;animation:pulse 1.1s ease-in-out infinite}
  .voice.thinking i{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.55);opacity:.5}}
  .acct label{display:block;font-size:.72rem;color:var(--soft);margin-top:.6rem}
  .acct .chk2{display:flex;gap:.5rem;align-items:center;margin-top:.7rem;font-size:.78rem;color:var(--soft)}
  .acct .chk2 input{width:auto}

  /* sign-in gate (first visit on a device) */
  body.locked .stage, body.locked .rail{opacity:0;pointer-events:none;filter:blur(14px)}
  .stage,.rail{transition:opacity .5s ease,filter .5s ease}
  .gate{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:1.5rem;background:color-mix(in srgb,var(--base) 35%,transparent);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px)}
  .gate.show{display:grid}
  .gate form{width:min(21rem,100%);padding:2rem 1.8rem 1.6rem;border:1px solid var(--line);border-radius:1.2rem;background:color-mix(in srgb,var(--base) 70%,transparent);box-shadow:0 2rem 4rem -2rem color-mix(in srgb,var(--ink) 40%,transparent)}
  .gate h1{font-weight:200;font-size:2.1rem;letter-spacing:-.02em;line-height:1}
  .gate .sub{margin:.55rem 0 1.4rem;font-size:.85rem;color:var(--soft)}
  .gate input{width:100%;padding:.6rem 0;font-size:.95rem;border-bottom:1px solid var(--line);margin-top:.35rem}
  .gate input::placeholder{color:var(--soft)}
  .gate input:focus{border-bottom-color:var(--ink)}
  .gate .primary{width:100%;margin-top:1.4rem;padding:.7rem 1rem;border-radius:2rem;background:var(--ink);color:var(--base);font-size:.9rem;font-weight:400;transition:opacity .2s}
  .gate .primary:disabled{opacity:.55;cursor:default}
  .gate .link{display:block;margin:.9rem auto 0;font-size:.78rem;color:var(--soft)}
  .gate .link:hover{color:var(--ink)}
  .gate .gmsg{min-height:1.1em;margin-top:.8rem;font-size:.78rem;line-height:1.4;color:var(--ink);text-align:center}

  /* account panel */
  .acct{position:fixed;left:calc(clamp(64px,6vw,96px) + 6px);top:50%;transform:translateY(-50%);width:17.5rem;max-height:84vh;overflow:auto;padding:1.1rem 1.2rem;border:1px solid var(--line);border-radius:1rem;background:color-mix(in srgb,var(--base) 80%,transparent);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);z-index:50;font-size:.85rem;display:none;scrollbar-width:none}
  .acct.open{display:block}
  .acct h3{font-weight:400;font-size:.95rem;margin-bottom:.5rem}
  .acct section + section{margin-top:1.1rem;padding-top:1rem;border-top:1px solid var(--line)}
  .acct p{color:var(--soft);font-size:.78rem;line-height:1.45;margin-bottom:.4rem}
  .acct input{width:100%;padding:.45rem 0;font-size:.88rem;border-bottom:1px solid var(--line)}
  .acct input::placeholder{color:var(--soft)}
  .acct .row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
  .acct .msg{margin:.9rem 0 0;min-height:1em;color:var(--ink)}

  /* ---------- mobile: phone layout ---------- */
  @media (max-width:900px){
    html{font-size:clamp(13px,2vw,16px)}
    body{overflow:auto;height:auto;min-height:100vh;min-height:100dvh}
    .rail{display:none}
    .cursor-glow{display:none}
    .fold{display:none}
    .stage{
      position:relative;left:0;right:0;top:0;bottom:auto;
      display:flex;flex-direction:column;gap:0;
      padding:env(safe-area-inset-top,1.2rem) 1.2rem calc(env(safe-area-inset-bottom,0px) + 1rem);
    }
    .col{border-left:0 !important;border-right:0 !important;padding:1.2rem 0}
    .col + .col{border-top:1px solid var(--line)}
    .col.folded > *:not(.fold){opacity:1;pointer-events:auto;visibility:visible}

    /* mobile nav bar at bottom */
    .mobile-nav{
      position:fixed;bottom:0;left:0;right:0;z-index:80;
      display:flex;justify-content:space-around;align-items:center;
      padding:.55rem 0 calc(.55rem + env(safe-area-inset-bottom,0px));
      background:color-mix(in srgb,var(--base) 82%,transparent);
      -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
      border-top:1px solid var(--line)
    }
    .mobile-nav button{
      width:2.6rem;height:2.6rem;display:grid;place-items:center;
      opacity:.55;transition:opacity .2s;background:none;border:0;color:inherit
    }
    .mobile-nav button:hover,.mobile-nav button.on{opacity:1}
    .mobile-nav svg{width:1.15rem;height:1.15rem;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}

    /* clock: smaller on mobile */
    .clock{font-size:min(18vw,5rem) !important}
    .datestamp{font-size:min(4vw,1rem) !important}
    .c2extra{font-size:min(3.5vw,.9rem) !important}

    /* calendar grid */
    .grid{font-size:.85rem}
    .day{height:2.2rem}

    /* dock */
    .dock{margin-top:1.2rem}
    .dock .apps{gap:.35rem}
    .dock .apps a{font-size:.78rem;padding:.22rem .6rem}
    .dock .cmds a{padding:.5rem .3rem}

    /* to-do */
    .c3,.c4{display:block !important}
    .body{font-size:.9rem}
    .add input.txt{font-size:.9rem}
    .addrow{flex-wrap:wrap}

    /* upcoming + music */
    .up{margin-top:1.2rem}
    .music{margin-top:1.5rem}
    .np img{width:4rem;height:4rem}

    /* palette text */
    .palette{font-size:.72rem}

    /* acct panel full-width on mobile */
    .acct{left:1rem;right:1rem;width:auto;max-width:none;top:auto;bottom:0;transform:none;max-height:70vh;border-radius:1rem 1rem 0 0}

    /* voice bar */
    .voice{max-width:92vw;bottom:calc(3.6rem + env(safe-area-inset-bottom,0px))}

    /* bg stays fixed */
    .bg{position:fixed}
  }

  /* very small phones */
  @media (max-width:400px){
    .stage{padding-left:.8rem;padding-right:.8rem}
    .clock{font-size:15vw !important}
    .dock .apps a{font-size:.72rem;padding:.18rem .5rem}
  }
</style>
</head>
<body class="locked">
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

<div class="bg" id="bg">
  <div class="blur-field">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
  </div>
  <div class="wash"></div>
  <div class="scrim"></div>
  <div class="grain"></div>
</div>

<nav class="rail" aria-label="Controls">
  <i class="pip"></i>
  <button id="btnPalette" aria-label="Change colors" title="Change colors (P)">
    <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
  </button>
  <button id="btnFocus" aria-label="Hide widgets" title="Hide widgets (F)">
    <svg viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M6 3v10"/></svg>
  </button>
  <button id="btnAcct" aria-label="Account and connections" title="Account and connections">
    <svg viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.6"/><path d="M2.8 13.6c.7-2.6 2.9-4 5.2-4s4.5 1.4 5.2 4"/></svg>
  </button>
  <button id="btnMic" aria-label="Voice command" title="Voice command (V)">
    <svg viewBox="0 0 16 16"><rect x="6" y="2" width="4" height="7.5" rx="2"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2"/></svg>
  </button>
  <button id="btnMusic" aria-label="Play or pause music" title="Play / pause">
    <svg viewBox="0 0 16 16"><path d="M6 12V4l6-1.5V10"/><circle cx="4.5" cy="12" r="1.5"/><circle cx="10.5" cy="10" r="1.5"/></svg>
  </button>
</nav>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <form id="gateForm" novalidate>
    <h1 id="gateTitle">Dashboard</h1>
    <p class="sub" id="gateSub">Sign in to open your dashboard.</p>
    <input type="email" id="gateEmail" name="email" placeholder="Email" autocomplete="username" aria-label="Email">
    <input type="password" id="gatePass" name="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
    <input type="text" id="gateCode" placeholder="Invite code" autocomplete="off" aria-label="Invite code" hidden>
    <button class="primary" type="submit" id="gateGo">Sign in</button>
    <button class="link" type="button" id="gateSwitch">Create an account</button>
    <div class="gmsg" id="gateMsg" role="status"></div>
  </form>
</div>

<div class="voice" id="voice" role="status" aria-live="polite"><i></i><span id="voiceText"></span></div>

<aside class="acct" id="acct" aria-label="Account and connections"></aside>

<main class="stage" id="stage">
  <!-- 1 · year + calendar -->
  <section class="col c1" data-name="Calendar">
    <div class="year" id="year"></div>
    <div class="dock" id="dock" aria-label="Launcher">
      <h3>Launch</h3>
      <div class="apps">
        <a href="eclipse://app/claude">Claude</a>
        <a href="eclipse://app/spotify">Spotify</a>
        <a href="eclipse://app/notion">Notion</a>
        <a href="eclipse://app/chrome">Chrome</a>
        <a href="eclipse://link/github">GitHub</a>
        <a href="eclipse://link/site">My site</a>
        <a href="eclipse://folder/project">Project folder</a>
      </div>
      <div class="cmds">
        <a href="eclipse://cmd/omniroute">OmniRoute<i class="dot" id="omniDot" title="OmniRoute status"></i></a>
        <a href="eclipse://link/omniroute-ui">OmniRoute dashboard</a>
        <a href="eclipse://cmd/omniroute-stop">Stop OmniRoute</a>
        <a href="eclipse://cmd/claude-code">Claude Code</a>
      </div>
      <div class="hint">Needs the Eclipse Launcher app. See launcher/README.md.</div>
    </div>
    <div class="cal">
      <div class="calhead">
        <span class="lbl" id="calLabel"></span>
        <span>
          <button id="prev" aria-label="Previous month">&#8249;</button>
          <button id="next" aria-label="Next month">&#8250;</button>
        </span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- 2 · clock + date -->
  <section class="col c2" data-name="Clock">
    <div class="clock" id="clock" aria-live="off"></div>
    <div class="datestamp">
      <span id="dow"></span><span class="sep">&middot;</span><span id="daymonth"></span>
    </div>
    <div class="c2extra">
      <div class="brief" id="brief"></div>
      <div class="counts" id="counts"></div>
    </div>
  </section>

  <!-- 3 · to-do -->
  <section class="col c3" data-name="To-do">
    <div class="todo-head"><h2 style="font-weight:400;font-size:.95rem">To-do</h2><span class="lbl" id="count"></span></div>
    <div class="tabs" role="tablist" id="tabs">
      <button data-tab="today">Today</button>
      <button data-tab="week">Week</button>
      <button data-tab="month">Month</button>
      <button data-tab="all">All</button>
    </div>
    <div class="list" id="list"></div>
    <div class="add">
      <input class="txt" id="newText" type="text" placeholder="Add a task, e.g. IELTS test friday 10am, or study every day" autocomplete="off" aria-label="New task">
      <div class="addrow">
        <button class="scope" id="scopeBtn" title="Click to change when this task is for">Today</button>
        <input type="date" id="newDue" aria-label="Due date">
        <button class="go" id="addBtn" aria-label="Add task">+</button>
      </div>
    </div>
  </section>

  <!-- 4 · palette, upcoming, music -->
  <section class="col c4" data-name="Upcoming">
    <button class="palette" id="palette" title="Click to change colors"></button>
    <div class="up" id="up"></div>
    <div class="music" id="music"></div>
  </section>
</main>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const store = {
    get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };
  const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const parse = s => new Date(s+"T00:00:00");
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  /* ---------- grain texture ---------- */
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>";
  document.documentElement.style.setProperty("--grain","url(\"data:image/svg+xml,"+encodeURIComponent(svg)+"\")");

  /* ---------- palettes (one per month by default) ---------- */
  const PALETTES = [
    {name:"Ink & Rust",     hex:"#B5502E", mood:"Focused start to the week", base:"#20242B", c1:"#B5502E", c2:"#2E3540", c3:"#6B7280", ink:"#F3EFE8", dark:1},
    {name:"Moss & Bone",    hex:"#4B6350", mood:"Steady, grounded",          base:"#EDE7D9", c1:"#4B6350", c2:"#F7F3E8", c3:"#C9AE7C", ink:"#20281F"},
    {name:"Plum & Copper",  hex:"#8C5A73", mood:"Warm, unhurried",           base:"#241A20", c1:"#8C5A73", c2:"#33252C", c3:"#C97B4A", ink:"#F2E8EA", dark:1},
    {name:"Chalk & Teal",   hex:"#2E7C74", mood:"Clear-headed",              base:"#EFF2EE", c1:"#2E7C74", c2:"#F8FAF6", c3:"#B7C4B0", ink:"#122421"},
    {name:"Slate & Gold",   hex:"#C9A24B", mood:"Deliberate, patient",       base:"#1D2126", c1:"#C9A24B", c2:"#2B313A", c3:"#57708A", ink:"#F1ECDC", dark:1},
    {name:"Clay & Sky",     hex:"#C97452", mood:"Open, low-effort",          base:"#F1E4D6", c1:"#C97452", c2:"#FAF3EA", c3:"#7FA8C9", ink:"#2A1E16"},
    {name:"Pine & Ember",   hex:"#D9663B", mood:"Restless energy, push week", base:"#182420", c1:"#D9663B", c2:"#22322C", c3:"#3F8F6B", ink:"#F2ECE2", dark:1},
    {name:"Linen & Ink",    hex:"#3D4A5C", mood:"Quiet reset",               base:"#F4F1EA", c1:"#3D4A5C", c2:"#FAF8F2", c3:"#A9997E", ink:"#1B1E22"}
  ];
  /* ---------- time-of-day themes (see docs/PRD-time-of-day-themes.md) ---------- */
  // start = minutes after midnight. Night wraps past midnight to Dawn.
  const PHASES = [
    {name:"Dawn",        start:300,  mood:"Soft peach, slow start",        base:"#E6CBBF", c1:"#E3A38C", c2:"#F2DFD4", c3:"#A9AECB", ink:"#241A18"},
    {name:"Morning",     start:480,  mood:"Fresh orange-white, clear",     base:"#EBCBAE", c1:"#E58E57", c2:"#F6E0CB", c3:"#DDA67C", ink:"#26180F"},
    {name:"Midday",      start:720,  mood:"Bright orange, full light",     base:"#EEC59E", c1:"#E8782F", c2:"#F8DDBE", c3:"#DA9459", ink:"#24150A"},
    {name:"Golden hour", start:960,  mood:"Amber and dusty rose",          base:"#DDA77C", c1:"#CB5F26", c2:"#EBC59F", c3:"#A4505F", ink:"#2A150C"},
    {name:"Evening",     start:1170, mood:"Blue dusk, one ember",          base:"#1A1E2E", c1:"#C8663A", c2:"#262B40", c3:"#6F7FA8", ink:"#F4EEE8", dark:1},
    {name:"Night",       start:1350, mood:"Deep navy, blue-white light",   base:"#0E1424", c1:"#2B3F7A", c2:"#17203A", c3:"#A9B8DA", ink:"#E9EEF8", dark:1}
  ];
  const BLEND_MIN = 30;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hx = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const mix = (a,b,t) => "#"+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t).toString(16).padStart(2,"0")).join("");
  // ?time=14:30 freezes the clock for previewing a phase
  const previewTime = (()=>{ const m=(new URLSearchParams(location.search).get("time")||"").match(/^(\d{1,2}):(\d{2})$/); return m ? (+m[1])*60+(+m[2]) : null; })();
  const nowMin = () => { if (previewTime!=null) return previewTime; const d=new Date(); return d.getHours()*60+d.getMinutes()+d.getSeconds()/60; };
  function autoPalette(){
    const m = nowMin();
    let i = PHASES.length-1;                                   // before Dawn = still Night
    PHASES.forEach((p,k)=>{ if (m>=p.start) i=k; });
    const cur = PHASES[i], nxt = PHASES[(i+1)%PHASES.length];
    let end = nxt.start; if (end<=m) end += 1440;
    const left = end-m;
    // blend only inside one tone family; light<->dark switches use the fade instead
    if (!reduceMotion && left<BLEND_MIN && !!cur.dark===!!nxt.dark){
      const t = 1-left/BLEND_MIN;
      const out = Object.assign({}, cur);
      ["base","c1","c2","c3","ink"].forEach(k=>{ out[k] = mix(cur[k], nxt[k], t); });
      return out;
    }
    return cur;
  }

  // palette mode: auto (follows the clock) or a pinned palette from PALETTES
  let pin = store.get("dash.pal.pin", null);
  if (pin!=null && !PALETTES[pin]) pin = null;
  let applied = null, appliedDark = null;

  function paintPalette(p){
    const r = document.documentElement.style;
    r.setProperty("--base",p.base); r.setProperty("--c1",p.c1); r.setProperty("--c2",p.c2);
    r.setProperty("--c3",p.c3);   r.setProperty("--ink",p.ink);
    document.body.classList.toggle("dark", !!p.dark);
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute("content", p.base);
    $("#palette").innerHTML = "<b></b><br><span></span><br><span></span>";
    const s = $("#palette").children;
    s[0].textContent = p.name + (pin==null ? " · Auto" : " · Pinned");
    s[2].textContent = p.hex || p.c1.toUpperCase(); s[4].textContent = p.mood;
  }
  function refreshPalette(){
    const p = pin==null ? autoPalette() : PALETTES[pin];
    const sig = JSON.stringify([p, pin]);
    if (sig===applied) return;
    const apply = () => { applied = sig; appliedDark = !!p.dark; paintPalette(p); };
    if (applied!==null && appliedDark!==!!p.dark){              // light <-> dark: fade through
      const bg = $("#bg"); bg.style.opacity = 0;
      setTimeout(()=>{ apply(); bg.style.opacity = 1; }, 420);
    } else apply();
  }
  function cyclePalette(){
    pin = pin==null ? 0 : (pin+1 < PALETTES.length ? pin+1 : null);   // Auto -> pins -> Auto
    setSetting("dash.pal.pin", pin);
    refreshPalette();
  }

  /* ---------- data ---------- */
  const seed = [];
  let tasks = store.get("dash.tasks", null) || seed;
  // one-time cleanup of tasks that were removed from the default list
  if (!store.get("dash.migrated.1", false)){
    const gone = [/numpy/i, /^leave for informatics test/i, /^informatics test at/i];
    tasks = tasks.filter(t => !gone.some(r => r.test(t.text)));
    store.set("dash.tasks", tasks); store.set("dash.migrated.1", true);
  }
  // one-time clear of old seed tasks (IELTS)
  if (!store.get("dash.migrated.2", false)){
    const oldSeed = [/^IELTS Reading/i, /^IELTS Writing/i, /^IELTS test$/i];
    tasks = tasks.filter(t => !oldSeed.some(r => r.test(t.text)));
    store.set("dash.tasks", tasks); store.set("dash.migrated.2", true);
  }
  let calEvents = [];              // read-only events from Google Calendar
  const hooks = {};
  // settings listed in api/settings.js follow the signed-in account; everything else stays on this device
  const setSetting = (k, v) => { store.set(k, v); if (hooks.setting) hooks.setting(k, v); };
  const save = () => { store.set("dash.tasks", tasks); if (hooks.save) hooks.save(tasks); };

  let tab = store.get("dash.tab","all");
  let scopeNew = "today";
  const SCOPES = ["today","week","month"];
  const cap = s => s[0].toUpperCase()+s.slice(1);
  let selDay = null;
  let curDay = iso(new Date());
  let view = {y:new Date().getFullYear(), m:new Date().getMonth()};

  const rel = s => {
    const t = parse(iso(new Date())), d = parse(s);
    const diff = Math.round((d-t)/864e5);
    if (diff===0) return "Today";
    if (diff===1) return "Tomorrow";
    return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
  };

  /* ---------- quick-add parser: "IELTS test friday 10am", "study every day" ---------- */
  const DAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  const pad2 = n => String(n).padStart(2,"0");
  const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
  function nextWeekday(dow, from){            // next date strictly after `from` that falls on weekday `dow`
    const d = parse(from); let diff = (dow-d.getDay()+7)%7; if (diff===0) diff = 7;
    return addDays(from, diff);
  }
  function monthDay(m, d){
    const now = new Date(), y = now.getFullYear();
    let c = new Date(y, m, d); if (iso(c) < iso(now)) c = new Date(y+1, m, d);
    return iso(c);
  }
  function quickParse(raw){
    let t = " "+raw+" ";
    const out = {text:raw, due:null, time:null, repeat:null};
    const today = iso(new Date());
    const take = (re, fn) => { const m = t.match(re); if (!m) return false; fn(m); t = t.replace(m[0]," "); return true; };
    let dow = null;
    const wd = "(sunday|monday|tuesday|wednesday|thursday|friday|saturday)";
    if (!take(new RegExp("\\bevery\\s+"+wd+"\\b","i"), m=>{ out.repeat="weekly"; dow=DAYS.indexOf(m[1].toLowerCase()); }))
      take(/\b(?:every\s+(day|week|month)|(daily|weekly|monthly))\b/i, m=>{
        const w = (m[1]||m[2]).toLowerCase();
        out.repeat = /^day|daily/.test(w) ? "daily" : /^week/.test(w) ? "weekly" : "monthly";
      });
    if (!take(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i, m=>{
      let h = +m[1]%12; if (m[3].toLowerCase()==="pm") h += 12;
      out.time = pad2(h)+":"+(m[2]||"00");
    })) take(/\b(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)\b/, m=>{ out.time = pad2(+m[1])+":"+m[2]; });
    take(/\b(\d{4}-\d{2}-\d{2})\b/, m=>{ out.due = m[1]; })
    || take(/\bday after tomorrow\b/i, ()=>{ out.due = addDays(today,2); })
    || take(/\b(?:tomorrow|tmrw)\b/i, ()=>{ out.due = addDays(today,1); })
    || take(/\b(?:today|tonight)\b/i, ()=>{ out.due = today; })
    || take(/\bin\s+(\d+)\s+(day|days|week|weeks)\b/i, m=>{ out.due = addDays(today, +m[1]*(/^week/i.test(m[2])?7:1)); })
    || take(new RegExp("\\b(?:next\\s+|this\\s+|on\\s+)?"+wd+"\\b","i"), m=>{ out.due = nextWeekday(DAYS.indexOf(m[1].toLowerCase()), today); })
    || take(/\b(?:on\s+)?(\d{1,2})(?:st|nd|rd|th)?\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i, m=>{ out.due = monthDay(MONTHS.indexOf(m[2].toLowerCase()), +m[1]); })
    || take(/\b(?:on\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:st|nd|rd|th)?\b/i, m=>{ out.due = monthDay(MONTHS.indexOf(m[1].toLowerCase()), +m[2]); });
    if (dow!=null && !out.due) out.due = nextWeekday(dow, today);
    if (out.repeat && !out.due) out.due = today;
    out.text = t.replace(/\s+/g," ").trim().replace(/^(?:to|remind me to)\s+/i,"").replace(/\s+(on|at|by|for|due|every)$/i,"").replace(/[,;:\s]+$/,"");
    if (!out.text){ out.text = raw.trim(); out.due = null; out.time = null; out.repeat = null; }
    return out;
  }
  const scopeFor = due => { if (!due) return "today"; const n = Math.round((parse(due)-parse(iso(new Date())))/864e5); return n<=0 ? "today" : n<=7 ? "week" : "month"; };
  const makeTask = o => ({id:uid(), text:o.text, done:false, scope:o.scope||scopeFor(o.due), due:o.due||null, time:o.time||null, repeat:o.repeat||null, spawned:false});
  function nextDue(t){
    const today = iso(new Date());
    let d = parse(t.due || today);
    do {
      if (t.repeat==="daily") d.setDate(d.getDate()+1);
      else if (t.repeat==="weekly") d.setDate(d.getDate()+7);
      else d.setMonth(d.getMonth()+1);
    } while (iso(d) <= today);
    return iso(d);
  }
  function toggleTask(t){
    t.done = !t.done;
    if (t.done && t.repeat && !t.spawned){            // repeating task: queue the next one
      t.spawned = true;
      tasks.push(makeTask({text:t.text, due:nextDue(t), time:t.time, repeat:t.repeat}));
    }
    save(); renderTasks(); renderUp(); renderCal();
  }

  /* ---------- date + clock ---------- */
  function renderDate(){
    const d = new Date();
    $("#year").textContent = d.getFullYear();
    $("#dow").textContent  = d.toLocaleDateString("en-GB",{weekday:"long"});
    $("#daymonth").textContent = d.toLocaleDateString("en-GB",{day:"numeric",month:"long"});
  }
  function tick(){
    const d = new Date(), p = n => String(n).padStart(2,"0");
    $("#clock").innerHTML = p(d.getHours())+":"+p(d.getMinutes())+"<small>"+p(d.getSeconds())+"</small>";
    updateProgress();
    if (d.getSeconds()===0 || !applied){ refreshPalette(); renderExtras(); }
    if (iso(d)!==curDay){
      curDay = iso(d);
      view = {y:d.getFullYear(), m:d.getMonth()};
      renderDate(); renderCal(); renderUp(); renderTasks();
    }
  }

  /* ---------- calendar ---------- */
  function renderCal(){
    const {y,m} = view, todayISO = iso(new Date());
    const off = (new Date(y,m,1).getDay()+6)%7, dim = new Date(y,m+1,0).getDate();
    const dots = new Set(tasks.filter(t=>t.due && !t.done).map(t=>t.due).concat(calEvents.map(e=>e.due)));
    const g = $("#grid"); g.innerHTML = "";
    "MTWTFSS".split("").forEach(l=>{ const s=document.createElement("span"); s.className="wd"; s.textContent=l; g.append(s); });
    for (let i=0;i<off;i++) g.append(document.createElement("span"));
    for (let d=1; d<=dim; d++){
      const id = iso(new Date(y,m,d)), b = document.createElement("button");
      b.textContent = d;
      b.className = "day"+(id===todayISO?" today":"")+(id===selDay?" sel":"")+(dots.has(id)?" has":"");
      b.setAttribute("aria-label", parse(id).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}));
      b.onclick = () => { selDay = selDay===id ? null : id; $("#newDue").value = selDay||""; renderCal(); renderUp(); };
      g.append(b);
    }
    $("#calLabel").textContent = new Date(y,m,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  }
  $("#prev").onclick = () => { view.m--; if(view.m<0){view.m=11;view.y--;} renderCal(); };
  $("#next").onclick = () => { view.m++; if(view.m>11){view.m=0;view.y++;} renderCal(); };

  /* ---------- to-do ---------- */
  function renderTasks(){
    document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
    const shown = tasks.filter(t => tab==="all" || t.scope===tab)
      .sort((a,b)=> (a.done-b.done) || (a.due||"9999").localeCompare(b.due||"9999"));
    const list = $("#list"); list.innerHTML = "";
    if (!shown.length){
      const e = document.createElement("div"); e.className="empty";
      e.textContent = tab==="all" ? "No tasks yet. Add your first one below." : "Nothing planned for this "+(tab==="today"?"day":tab)+".";
      list.append(e);
    }
    shown.forEach(t=>{
      const row = document.createElement("div"); row.className = "item"+(t.done?" done":"");
      const chk = document.createElement("button"); chk.className="chk";
      chk.setAttribute("aria-label", (t.done?"Mark not done: ":"Mark done: ")+t.text);
      chk.onclick = () => toggleTask(t);
      const body = document.createElement("div"); body.className="body";
      body.append(document.createTextNode(t.text));
      const meta = [];
      if (tab==="all") meta.push(cap(t.scope));
      if (t.due) meta.push(rel(t.due)+(t.time?" "+t.time:""));
      if (t.repeat) meta.push("\u21bb "+cap(t.repeat));
      if (meta.length){ const m=document.createElement("span"); m.className="meta"; m.textContent=meta.join(", "); body.append(m); }
      const del = document.createElement("button"); del.className="del"; del.textContent="\u00d7";
      del.setAttribute("aria-label","Delete task: "+t.text);
      del.onclick = () => { tasks = tasks.filter(x=>x.id!==t.id); save(); renderTasks(); renderUp(); renderCal(); };
      row.append(chk, body, del); list.append(row);
    });
    const open = tasks.filter(t=>!t.done && (tab==="all"||t.scope===tab)).length;
    $("#count").textContent = open+" open";
    renderExtras();
  }
  function addTask(){
    const inp = $("#newText"), text = inp.value.trim();
    if (!text) return;
    const q = quickParse(text);
    const t = makeTask({text:q.text, due:q.due||$("#newDue").value||null, time:q.time, repeat:q.repeat, scope:q.due?null:scopeNew});
    tasks.push(t);
    save(); inp.value = "";
    if (tab!=="all" && tab!==t.scope) tab = t.scope;
    renderTasks(); renderUp(); renderCal();
  }
  $("#newText").addEventListener("keydown", e => { if(e.key==="Enter") addTask(); });
  $("#addBtn").onclick = addTask;
  $("#scopeBtn").onclick = () => {
    scopeNew = SCOPES[(SCOPES.indexOf(scopeNew)+1)%SCOPES.length];
    $("#scopeBtn").textContent = cap(scopeNew);
  };
  $("#tabs").onclick = e => {
    const b = e.target.closest("button"); if(!b) return;
    tab = b.dataset.tab; store.set("dash.tab",tab);
    if (tab!=="all"){ scopeNew = tab; $("#scopeBtn").textContent = cap(tab); }
    renderTasks();
  };

  /* ---------- daily brief + key-date countdowns ---------- */
  let weather = null;
  const KEYRE = /\b(test|exam|quiz|deadline|interview|finals?|midterm|presentation)\b/i;
  const daysUntil = s => Math.round((parse(s)-parse(iso(new Date())))/864e5);
  function renderExtras(){
    const now = new Date(), todayISO = iso(now), nowHM = pad2(now.getHours())+":"+pad2(now.getMinutes());
    const todays = tasks.filter(t=>!t.done && t.due===todayISO).concat(calEvents.filter(e=>e.due===todayISO));
    const brief = $("#brief"); brief.innerHTML = "";
    const l1 = document.createElement("div"), n = todays.length;
    const b = document.createElement("b"); b.textContent = n+(n===1?" thing":" things");
    if (n){ l1.append(b, " today"); } else l1.textContent = "Nothing due today";
    const nxt = todays.filter(x=>x.time && x.time>=nowHM).sort((a,c)=>a.time.localeCompare(c.time))[0];
    if (nxt) l1.append(" · Next: "+nxt.text+" at "+nxt.time);
    brief.append(l1);
    if (weather){
      const l2 = document.createElement("div"), w = [];
      w.push(Math.round(weather.temp)+"° "+weather.desc);
      if (weather.sunset && nowHM < weather.sunset) w.push("Sunset "+weather.sunset);
      else if (weather.nextSunrise) w.push("Sunrise "+weather.nextSunrise);
      l2.textContent = w.join(" · "); brief.append(l2);
    }
    const keys = tasks.filter(t=>!t.done && t.due && t.due>=todayISO && KEYRE.test(t.text))
      .concat(calEvents.filter(e=>e.due>=todayISO && KEYRE.test(e.text)))
      .sort((x,y)=>x.due.localeCompare(y.due) || (x.time||"").localeCompare(y.time||"")).slice(0,3);
    const box = $("#counts"); box.innerHTML = "";
    if (!keys.length) return;
    const h = document.createElement("span"); h.className="lbl"; h.textContent="Key dates"; box.append(h);
    keys.forEach(k=>{
      const d = daysUntil(k.due), r = document.createElement("div"); r.className="row";
      const a = document.createElement("span"); a.textContent = k.text;
      const c = document.createElement("span");
      c.textContent = d===0 ? (k.time ? "Today "+k.time : "Today") : d===1 ? "Tomorrow" : "in "+d+" days";
      r.append(a,c); box.append(r);
    });
  }

  /* ---------- upcoming ---------- */
  function renderUp(){
    const todayISO = iso(new Date());
    let items = tasks.filter(t=>t.due && !t.done).concat(calEvents);
    items = selDay ? items.filter(t=>t.due===selDay) : items.filter(t=>t.due>=todayISO);
    items.sort((a,b)=>a.due.localeCompare(b.due) || (a.time||"").localeCompare(b.time||""));
    items = items.slice(0,5);
    const box = $("#up"); box.innerHTML = "";
    const h = document.createElement("h3");
    const title = document.createElement("span");
    title.textContent = selDay ? parse(selDay).toLocaleDateString("en-GB",{day:"numeric",month:"long"}) : "Upcoming";
    h.append(title);
    if (selDay){ const c=document.createElement("button"); c.textContent="Show all"; c.onclick=()=>{selDay=null;$("#newDue").value="";renderCal();renderUp();}; h.append(c); }
    box.append(h);
    if (!items.length){ const e=document.createElement("div"); e.className="empty"; e.textContent = selDay?"Nothing on this day.":"Nothing scheduled. Give a task a date to see it here."; box.append(e); return; }
    items.forEach(t=>{
      const r=document.createElement("div"); r.className="uprow";
      const w=document.createElement("span"); w.className="when"; w.textContent=rel(t.due);
      const x=document.createElement("span"); x.textContent=t.text;
      if (t.time){ const tm=document.createElement("span"); tm.className="meta"; tm.style.cssText="display:block;font-size:.72rem;color:var(--soft)"; tm.textContent=t.time; x.append(tm); }
      r.append(w,x); box.append(r);
    });
  }

  /* ---------- music: now playing + controls (Spotify Web API, see spotify.js) ---------- */
  let nowPlaying = null, spotify = {configured:false, connected:false, controls:true, msg:""};
  const act = (type, extra) => dispatchEvent(new CustomEvent("dash:action", {detail:Object.assign({type}, extra||{})}));
  function npProgress(){ return nowPlaying ? nowPlaying.progress + (nowPlaying.playing ? Date.now()-nowPlaying.ts : 0) : 0; }
  function updateProgress(){
    const bar = $("#npBar"); if (!bar || !nowPlaying) return;
    bar.style.width = Math.min(100, npProgress()/Math.max(1,nowPlaying.duration)*100)+"%";
  }
  const ICONS = {
    prev:'<svg viewBox="0 0 16 16"><path d="M3 3h1.5v10H3zM13 3v10L5.5 8z"/></svg>',
    next:'<svg viewBox="0 0 16 16"><path d="M11.5 3H13v10h-1.5zM3 3l7.5 5L3 13z"/></svg>',
    play:'<svg viewBox="0 0 16 16"><path d="M4.5 2.5v11l9-5.5z"/></svg>',
    pause:'<svg viewBox="0 0 16 16"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>'
  };
  function renderMusic(){
    const box = $("#music"); box.innerHTML = "";
    const top = document.createElement("div"); top.className="top";
    const t = document.createElement("span"); t.textContent = "Music"; t.style.fontWeight = 400; t.style.fontSize = ".95rem";
    top.append(t); box.append(top);
    if (nowPlaying){
      const wrap = document.createElement("div"); wrap.className="np-wrap";
      const a = document.createElement("a"); a.className="np"; a.href = nowPlaying.url||"#"; a.target="_blank"; a.rel="noopener";
      const img = document.createElement("img"); img.alt = "Album cover"; if (nowPlaying.art) img.src = nowPlaying.art;
      const info = document.createElement("div"); info.className="info";
      const ttl = document.createElement("div"); ttl.className="ttl"; ttl.textContent = nowPlaying.title;
      const art = document.createElement("div"); art.className="art"; art.textContent = nowPlaying.artist;
      const bar = document.createElement("div"); bar.className="bar"; bar.innerHTML = '<i id="npBar"></i>';
      info.append(ttl, art, bar); a.append(img, info); wrap.append(a);
      if (spotify.controls){
        const ctl = document.createElement("div"); ctl.className="ctl";
        const mk = (label, icon, cmd, cls) => { const b=document.createElement("button"); b.innerHTML=icon; b.setAttribute("aria-label",label); b.title=label; if(cls) b.className=cls; b.onclick=()=>act("spotify-cmd",{cmd}); return b; };
        ctl.append(mk("Previous", ICONS.prev, "previous"), mk(nowPlaying.playing?"Pause":"Play", nowPlaying.playing?ICONS.pause:ICONS.play, "toggle", "main"), mk("Next", ICONS.next, "next"));
        wrap.append(ctl);
      } else {
        const b = document.createElement("button"); b.className="pill"; b.textContent="Reconnect Spotify for controls"; b.onclick=()=>act("spotify-connect"); wrap.append(b);
      }
      box.append(wrap); updateProgress();
    } else if (spotify.connected){
      const h = document.createElement("div"); h.className="hint"; h.textContent = "Nothing playing right now.";
      const o = document.createElement("a"); o.href="eclipse://app/spotify"; o.className="pill"; o.textContent="Open Spotify"; o.style.cssText="display:inline-block;margin-top:.6rem;text-decoration:none";
      box.append(h, o);
    } else if (spotify.configured){
      const h = document.createElement("div"); h.className="hint"; h.textContent = "Show what's playing, with album art and controls.";
      const b = document.createElement("button"); b.className="pill"; b.textContent="Connect Spotify"; b.onclick=()=>act("spotify-connect");
      box.append(h, b);
    } else {
      const h = document.createElement("div"); h.className="hint"; h.textContent = "Add a Spotify client ID in config.js to show what's playing (see SETUP.md).";
      box.append(h);
    }
    if (spotify.msg){ const m = document.createElement("div"); m.className="hint"; m.textContent = spotify.msg; box.append(m); }
  }

  /* ---------- fold each section on its own ---------- */
  let folded = store.get("dash.fold", [false,false,false,false]);
  function paintFold(){
    document.querySelectorAll(".col").forEach((c,i)=>{
      c.classList.toggle("folded", !!folded[i]);
      const b = c.querySelector(".fold");
      b.setAttribute("aria-expanded", String(!folded[i]));
      b.setAttribute("aria-label", (folded[i]?"Show ":"Hide ")+c.dataset.name);
      b.title = (folded[i]?"Show ":"Hide ")+c.dataset.name;
    });
  }
  document.querySelectorAll(".col").forEach((c,i)=>{
    const b = document.createElement("button"); b.className="fold";
    b.innerHTML = '<svg viewBox="0 0 16 16"><path d="M3 8h10"/><path class="v" d="M8 3v10"/></svg>';
    b.onclick = () => { folded[i] = !folded[i]; setSetting("dash.fold", folded); paintFold(); };
    c.append(b);
  });
  paintFold();

  /* ---------- account panel ---------- */
  const acct = {configured:false, user:null, calendar:"off", events:0, busy:false};
  const el = (tag, cls, text) => { const n=document.createElement(tag); if(cls) n.className=cls; if(text!=null) n.textContent=text; return n; };
  const pill = (label, fn) => { const b=el("button","pill",label); b.onclick=fn; return b; };
  function field(label, key, placeholder, type){
    const wrap = document.createElement("div");
    const l = el("label",null,label), i = el("input");
    i.type = type||"text"; i.placeholder = placeholder||""; i.value = store.get(key, "") || "";
    i.setAttribute("aria-label", label);
    i.addEventListener("change", () => setSetting(key, i.value.trim()));
    wrap.append(l, i); return wrap;
  }
  function renderAcct(){
    const p = $("#acct"), keep = p.querySelector(".msg") ? p.querySelector(".msg").textContent : "";
    p.innerHTML = "";
    const s1 = el("section"); s1.append(el("h3",null,"Account"));
    if (!acct.configured){
      s1.append(el("p",null,"Sync is off, so your tasks live only in this browser. Set apiBase in config.js to save them to your database and sign in (see SETUP.md)."));
    } else if (!acct.user){
      s1.append(el("p",null,"You're not signed in."));
      const row = el("div","row"); row.append(pill("Sign in", ()=>lock())); s1.append(row);
    } else {
      s1.append(el("p",null,"Signed in as "+(acct.user.email||"your account")+". This device stays signed in for about 90 days, and tasks sync to your database."));
      const row = el("div","row");
      row.append(pill("Sign out", ()=>act("signout")), pill("Sign out everywhere", ()=>act("signout-all")));
      s1.append(row);
    }
    p.append(s1);
    if (acct.calendarConfigured){
      const s2 = el("section"); s2.append(el("h3",null,"Google Calendar"));
      if (acct.configured && !acct.user) s2.append(el("p",null,"Sign in first to connect your calendar."));
      else if (acct.calendar==="on"){
        s2.append(el("p",null,"Connected. "+acct.events+" upcoming event"+(acct.events===1?"":"s")+" shown in Upcoming and the month grid."));
        const row = el("div","row"); row.append(pill("Refresh", ()=>act("calendar-refresh"))); s2.append(row);
      } else {
        s2.append(el("p",null,acct.calendar==="expired" ? "Google's access lapsed (it lasts about an hour). Reconnect to refresh events." : "Read-only access to show your events here."));
        const row = el("div","row"); row.append(pill(acct.calendar==="expired"?"Reconnect":"Connect Google Calendar", ()=>act("calendar"))); s2.append(row);
      }
      p.append(s2);
    }
    const s3 = el("section"); s3.append(el("h3",null,"Spotify"));
    if (!spotify.configured) s3.append(el("p",null,"Add a Spotify client ID in config.js to show the song that's playing, with its cover (see SETUP.md)."));
    else if (spotify.connected){
      s3.append(el("p",null,"Connected. The current song and album cover show in the Music section."));
      const row = el("div","row"); row.append(pill("Disconnect", ()=>act("spotify-disconnect"))); s3.append(row);
    } else {
      s3.append(el("p",null,"Show what's playing, with album art."));
      const row = el("div","row"); row.append(pill("Connect Spotify", ()=>act("spotify-connect"))); s3.append(row);
    }
    p.append(s3);

    const s4 = el("section"); s4.append(el("h3",null,"Voice assistant"));
    s4.append(el("p",null,"Press V or the mic button and speak. Claude runs through OmniRoute on this Mac, so no key is stored on the site. Start OmniRoute from the Launch section."));
    s4.append(field("OmniRoute address","dash.omni.base","http://localhost:20128"));
    s4.append(field("OmniRoute API key (only if you set one)","dash.omni.key","","password"));
    s4.append(field("Model","dash.omni.model","auto"));
    const sp = el("label","chk2"), cb = el("input"); cb.type="checkbox"; cb.checked = store.get("dash.voice.speak", true);
    cb.onchange = () => setSetting("dash.voice.speak", cb.checked);
    sp.append(cb, document.createTextNode("Speak replies aloud")); s4.append(sp);
    p.append(s4);

    const s5 = el("section"); s5.append(el("h3",null,"Weather and sun times"));
    const loc = store.get("dash.weather.loc", null);
    s5.append(el("p",null, loc ? "Showing "+loc.name+"." : "Shows temperature and sunset under the date."));
    const city = el("input"); city.type="text"; city.placeholder="City"; city.setAttribute("aria-label","City");
    city.addEventListener("keydown", e => { if (e.key==="Enter") act("weather-city",{city:city.value.trim()}); });
    const wr = el("div","row");
    wr.append(pill("Set city", ()=>act("weather-city",{city:city.value.trim()})), pill("Use my location", ()=>act("weather-geo")));
    s5.append(city, wr);
    p.append(s5);
    p.append(el("p","msg",keep));
  }
  function setMsg(t){ const m=$("#acct .msg"); if (m) m.textContent = t||""; }
  $("#btnAcct").onclick = e => { e.stopPropagation(); $("#acct").classList.toggle("open"); $("#btnAcct").classList.toggle("on"); };
  document.addEventListener("click", e => {
    if (!$("#acct").classList.contains("open")) return;
    if (!e.target.closest("#acct") && !e.target.closest("#btnAcct")){ $("#acct").classList.remove("open"); $("#btnAcct").classList.remove("on"); }
  });

  /* ---------- sign-in gate ---------- */
  let gateMode = "signin";
  function paintGate(){
    const up = gateMode==="signup";
    $("#gateSub").textContent = up ? "Create your account with your invite code." : "Sign in to open your dashboard.";
    $("#gateGo").textContent = up ? "Create account" : "Sign in";
    $("#gateSwitch").textContent = up ? "I already have an account" : "Create an account";
    $("#gateCode").hidden = !up;
    $("#gatePass").autocomplete = up ? "new-password" : "current-password";
  }
  function lock(msg){
    document.body.classList.add("locked"); $("#gate").classList.add("show");
    $("#gateMsg").textContent = msg||""; paintGate();
    setTimeout(()=>{ const i=$("#gateEmail"); i && i.focus(); }, 50);
  }
  function unlock(){
    document.body.classList.remove("locked"); $("#gate").classList.remove("show");
    $("#gatePass").value = ""; $("#gateCode").value = "";
  }
  $("#gateSwitch").onclick = () => { gateMode = gateMode==="signin" ? "signup" : "signin"; $("#gateMsg").textContent=""; paintGate(); };
  $("#gateForm").addEventListener("submit", e => {
    e.preventDefault();
    const email = $("#gateEmail").value.trim(), password = $("#gatePass").value;
    if (!email || !password){ $("#gateMsg").textContent = "Enter your email and password."; return; }
    act(gateMode==="signup" ? "register" : "login", {email, password, code:$("#gateCode").value.trim()});
  });
  setTimeout(()=>{ if (!window.__syncReady) unlock(); }, 5000);   // never leave the page locked if sync.js fails to load

  /* ---------- API for the sync modules (sync.js, calendar.js, spotify.js) ---------- */
  window.Dash = {
    getTasks: () => tasks,
    setTasks(arr){ tasks = arr; store.set("dash.tasks", tasks); renderTasks(); renderUp(); renderCal(); },
    onSave(fn){ hooks.save = fn; },
    setEvents(list){ calEvents = list||[]; acct.events = calEvents.length; renderUp(); renderCal(); renderAcct(); renderExtras(); },
    setAccount(patch){ Object.assign(acct, patch); renderAcct(); },
    setSpotify(patch){ Object.assign(spotify, patch); renderAcct(); renderMusic(); },
    setWeather(w){ weather = w; renderExtras(); },
    getEvents: () => calEvents,
    getSetting: (k, d) => store.get(k, d),
    setSetting,
    onSetting(fn){ hooks.setting = fn; },
    applySettings(obj){
      Object.keys(obj||{}).forEach(k => store.set(k, obj[k]));
      pin = store.get("dash.pal.pin", null); if (pin!=null && !PALETTES[pin]) pin = null;
      folded = store.get("dash.fold", [false,false,false,false]);
      refreshPalette(); paintFold(); renderAcct();
    },
    lock, unlock,
    gateMsg(t){ $("#gateMsg").textContent = t||""; },
    gateBusy(b){ $("#gateGo").disabled = !!b; },
    addTask(o){
      const t = makeTask({text:o.text, due:o.due, time:o.time, repeat:o.repeat});
      tasks.push(t); save(); renderTasks(); renderUp(); renderCal(); return t;
    },
    completeTask(id){ const t = tasks.find(x=>x.id===id && !x.done); if (!t) return false; toggleTask(t); return true; },
    launchIds: () => [...document.querySelectorAll("#dock a[href^='eclipse://']")].map(a=>a.getAttribute("href").slice(10)+" ("+a.textContent.trim()+")"),
    launch(kind, id){
      const a = document.querySelector('#dock a[href="eclipse://'+kind+'/'+id+'"]');
      if (!a) return false; a.click(); return true;
    },
    setOmniStatus(on){ const d = $("#omniDot"); if (d) d.classList.toggle("on", !!on); },
    setMic(on){ document.body.classList.toggle("listening", !!on); $("#btnMic").classList.toggle("on", !!on); },
    voice(v){
      const box = $("#voice"); clearTimeout(box._t);
      if (!v || v.state==="idle"){ box.classList.remove("show","listening","thinking"); return; }
      box.classList.add("show");
      box.classList.toggle("listening", v.state==="listening");
      box.classList.toggle("thinking", v.state==="thinking");
      $("#voiceText").textContent = v.text || (v.state==="listening" ? "Listening\u2026" : v.state==="thinking" ? "Thinking\u2026" : "");
      if (v.state==="done" || v.state==="error") box._t = setTimeout(()=>box.classList.remove("show"), v.state==="error" ? 7000 : 8000);
    },
    setNowPlaying(np){
      const same = nowPlaying && np && nowPlaying.id===np.id && nowPlaying.playing===np.playing;
      nowPlaying = np;
      if (same){ updateProgress(); return; }
      renderMusic();
    },
    setMsg
  };
  renderAcct();

  /* ---------- rail + keys ---------- */
  $("#palette").onclick = cyclePalette;
  $("#btnPalette").onclick = cyclePalette;
  $("#btnFocus").onclick = () => { document.body.classList.toggle("focus"); $("#btnFocus").classList.toggle("on"); };
  $("#btnMusic").onclick = () => {
    if (spotify.connected) act("spotify-cmd", {cmd:"toggle"});
    else if (spotify.configured) act("spotify-connect");
    else { $("#acct").classList.add("open"); $("#btnAcct").classList.add("on"); }
  };
  $("#btnMic").onclick = () => act("voice-toggle");
  document.addEventListener("keydown", e => {
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (e.key==="p"||e.key==="P") cyclePalette();
    if (e.key==="f"||e.key==="F") $("#btnFocus").click();
    if (e.key==="v"||e.key==="V") act("voice-toggle");
    if (e.key==="Escape" && $("#acct").classList.contains("open")){ $("#acct").classList.remove("open"); $("#btnAcct").classList.remove("on"); return; }
    if (e.key==="Escape" && selDay){ selDay=null; $("#newDue").value=""; renderCal(); renderUp(); }
  });

  /* ---------- cursor ---------- */
  (function(){
    const glow = $("#cursorGlow"), bg = $("#bg");
    const interactiveSel = "button, a, input, .day, .item, .uprow, [role='tab']";
    let raf = null, tx = innerWidth/2, ty = innerHeight*.38, cx = tx, cy = ty;
    function loop(){
      cx += (tx-cx)*.45; cy += (ty-cy)*.45;
      glow.style.transform = "translate("+cx+"px,"+cy+"px)";
      bg.style.setProperty("--mx", (cx/innerWidth*100)+"%");
      bg.style.setProperty("--my", (cy/innerHeight*100)+"%");
      raf = requestAnimationFrame(loop);
    }
    addEventListener("pointermove", e => {
      tx = e.clientX; ty = e.clientY;
      glow.classList.toggle("hover", !!e.target.closest(interactiveSel));
    }, {passive:true});
    addEventListener("pointerdown", () => glow.classList.add("down"), {passive:true});
    addEventListener("pointerup",   () => glow.classList.remove("down"), {passive:true});
    addEventListener("pointerleave", () => glow.style.opacity = 0, {passive:true});
    addEventListener("pointerenter", () => glow.style.opacity = "", {passive:true});
    loop();
  })();

  /* ---------- mobile nav ---------- */
  const mNav = $("#mobileNav");
  if (mNav){
    mNav.querySelectorAll("[data-section]").forEach(b => {
      b.onclick = () => {
        const sec = $("."+b.dataset.section);
        if (sec) sec.scrollIntoView({behavior:"smooth",block:"start"});
        mNav.querySelectorAll("button").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
      };
    });
    const ma = $("#mobileAcct");
    if (ma) ma.onclick = e => { e.stopPropagation(); $("#acct").classList.toggle("open"); ma.classList.toggle("on"); };
    // highlight current section on scroll
    const cols = [...document.querySelectorAll(".col")];
    const navBtns = [...mNav.querySelectorAll("[data-section]")];
    let scrollT;
    window.addEventListener("scroll", () => {
      clearTimeout(scrollT);
      scrollT = setTimeout(() => {
        const mid = innerHeight * 0.35;
        let active = cols[0];
        cols.forEach(c => { if (c.getBoundingClientRect().top <= mid) active = c; });
        const cls = [...active.classList].find(c => /^c\d$/.test(c));
        navBtns.forEach(b => b.classList.toggle("on", b.dataset.section === cls));
      }, 80);
    }, {passive:true});
  }
