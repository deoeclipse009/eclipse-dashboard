<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
  :root{
    --base:#B7ADE0; --c1:#8F7FD0; --c2:#E6DFF3; --c3:#C99AC4; --ink:#1d1838;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(12px,1.55vh,17px);height:100%}
  body{
    height:100%;overflow:hidden;color:var(--ink);background:var(--base);
    font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;
    font-weight:300;-webkit-font-smoothing:antialiased;
    --line:color-mix(in srgb,var(--ink) 30%,transparent);
    --soft:color-mix(in srgb,var(--ink) 62%,transparent);
  }
  button,input{font:inherit;color:inherit;background:none;border:0;outline:0}
  button{cursor:pointer}
  :focus-visible{outline:1px solid var(--ink);outline-offset:3px;border-radius:3px}

  /* ---------- background: drifting gradient + grain ---------- */
  .bg{position:fixed;inset:0;overflow:hidden;background:var(--base);transition:opacity .45s ease;--mx:50%;--my:38%}
  .blur-field{position:absolute;inset:-10%;filter:blur(min(9vw,120px));transform:translateZ(0)}
  .blob{position:absolute;border-radius:50%;opacity:.85;transition:transform 1.8s cubic-bezier(.2,.6,.2,1)}
  .b1{width:60vw;height:60vw;left:-12vw;top:-14vw;background:var(--c1);transform:translate(calc((var(--mx) - 50%) * .03),calc((var(--my) - 50%) * .03))}
  .b2{width:52vw;height:52vw;right:-14vw;top:4vh;background:var(--c3);transform:translate(calc((var(--mx) - 50%) * -.025),calc((var(--my) - 50%) * .02))}
  .b3{width:64vw;height:64vw;left:8vw;bottom:-30vw;background:var(--c2);opacity:.75;transform:translate(calc((var(--mx) - 50%) * .02),calc((var(--my) - 50%) * -.03))}
  .b4{width:44vw;height:44vw;right:6vw;bottom:-18vw;background:var(--c1);opacity:.55;transform:translate(calc((var(--mx) - 50%) * -.02),calc((var(--my) - 50%) * -.02))}
  .wash{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--base) 88%,transparent),transparent 60%)}
  .grain{position:absolute;inset:0;background-image:var(--grain);background-size:240px;opacity:.6;mix-blend-mode:overlay;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.blob{transition:none}}

  /* ---------- left rail ---------- */
  .cursor-glow{position:fixed;left:0;top:0;width:14px;height:14px;margin:-7px;border-radius:50%;background:color-mix(in srgb,var(--ink) 70%,transparent);pointer-events:none;z-index:999;mix-blend-mode:difference;transform:translate(-100px,-100px);transition:width .1s ease-out,height .1s ease-out,margin .1s ease-out,opacity .15s;opacity:.55;will-change:transform}
  .cursor-glow.hover{width:34px;height:34px;margin:-17px;opacity:.9}
  .cursor-glow.down{width:10px;height:10px;margin:-5px}
  @media (hover:none),(pointer:coarse){.cursor-glow{display:none}}
  .rail{position:fixed;left:clamp(14px,2vw,30px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:1.1rem;align-items:center}
  .rail button{width:1.9rem;height:1.9rem;display:grid;place-items:center;opacity:.5;transition:opacity .2s}
  .rail button:hover,.rail button.on{opacity:1}
  .rail svg{width:1.05rem;height:1.05rem;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
  .rail .pip{width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:.55;margin-bottom:.4rem}

  /* ---------- stage: hairline columns ---------- */
  .stage{
    position:fixed;left:clamp(64px,6vw,96px);right:4.5vw;top:9vh;bottom:8vh;
    display:grid;grid-template-columns:1fr 2fr 1.15fr 1.15fr;
  }
  .col{position:relative;display:flex;flex-direction:column;min-height:0;padding:0 clamp(14px,1.5vw,26px);border-left:1px solid var(--line)}
  .col:last-child{border-right:1px solid var(--line)}
  .lbl{font-size:.74rem;letter-spacing:.02em;color:var(--soft)}
  .hide-in-focus{transition:opacity .35s}
  body.focus .c3 > *, body.focus .c4 > *{opacity:0;pointer-events:none}

  /* column 1: year + month grid */
  .year{font-size:.8rem;font-weight:400;letter-spacing:.02em}
  .cal{margin-top:auto;padding-bottom:.2rem}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem}
  .calhead button{width:1.6rem;height:1.6rem;opacity:.55;font-size:1.05rem;line-height:1}
  .calhead button:hover{opacity:1}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:.15rem;text-align:center;font-size:.8rem}
  .wd{font-weight:500;font-size:.72rem;padding-bottom:.55rem}
  .day{position:relative;height:1.85rem;border-radius:.4rem;font-weight:300;transition:background .2s}
  .day:hover{background:color-mix(in srgb,var(--ink) 10%,transparent)}
  .item{border-radius:.5rem;transition:background .2s}
  .item:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
  .uprow{transition:background .2s;border-radius:.4rem}
  .uprow:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
  .day.today{background:var(--ink);color:var(--base);font-weight:500}
  .day.sel{box-shadow:inset 0 0 0 1px var(--ink)}
  .day.has::after{content:"";position:absolute;left:50%;bottom:.2rem;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:currentColor;opacity:.75}

  /* column 2: big date, month, clock */
  .c2{container-type:inline-size;overflow:hidden}
  .clock{margin-top:auto;max-width:100%;font-weight:100;line-height:.82;letter-spacing:-.03em;font-size:min(20vh,11vw,44cqw);white-space:nowrap;font-variant-numeric:tabular-nums}
  .clock small{font-size:.28em;font-weight:200;margin-left:.3rem;color:var(--soft);letter-spacing:0;font-variant-numeric:tabular-nums}
  .datestamp{margin-top:2.4vh;margin-bottom:auto;font-size:min(2.6vh,7.5cqw);font-weight:300;letter-spacing:.01em;color:var(--soft)}
  .datestamp .sep{margin:0 .55em;opacity:.6}
  .datestamp #daymonth{color:var(--ink)}

  /* column 3: to-do */
  .todo-head{display:flex;justify-content:space-between;align-items:baseline}
  .tabs{display:flex;gap:1rem;margin:.9rem 0 1.1rem;font-size:.85rem}
  .tabs button{opacity:.5;padding-bottom:.25rem;border-bottom:1px solid transparent}
  .tabs button:hover{opacity:.85}
  .tabs button.on{opacity:1;border-bottom-color:var(--ink)}
  .list{flex:1;min-height:0;overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:.15rem}
  .list::-webkit-scrollbar{display:none}
  .item{display:flex;align-items:flex-start;gap:.7rem;padding:.42rem 0;position:relative}
  .chk{flex:none;width:.95rem;height:.95rem;margin-top:.18rem;border:1px solid var(--ink);border-radius:50%;position:relative;transition:background .2s}
  .item.done .chk{background:var(--ink)}
  .item.done .chk::after{content:"";position:absolute;left:.27rem;top:.12rem;width:.22rem;height:.42rem;border:solid var(--base);border-width:0 1.2px 1.2px 0;transform:rotate(40deg)}
  .body{flex:1;min-width:0;text-align:left;line-height:1.3;font-size:.95rem}
  .body .meta{display:block;font-size:.72rem;color:var(--soft);margin-top:.1rem}
  .item.done .body{opacity:.45;text-decoration:line-through;text-decoration-thickness:1px}
  .del{opacity:0;font-size:1rem;line-height:1;width:1.4rem;height:1.4rem;transition:opacity .2s}
  .item:hover .del,.del:focus-visible{opacity:.6}
  .del:hover{opacity:1 !important}
  .empty{font-size:.85rem;color:var(--soft);padding:.4rem 0}
  .add{border-top:1px solid var(--line);padding-top:.8rem;margin-top:.6rem}
  .add input.txt{width:100%;padding:.3rem 0;font-size:.95rem;border-bottom:1px solid transparent}
  .add input.txt::placeholder{color:var(--soft)}
  .add input.txt:focus{border-bottom-color:var(--line)}
  .addrow{display:flex;align-items:center;gap:.8rem;margin-top:.5rem;font-size:.78rem}
  .addrow .scope{color:var(--soft);padding:.1rem .5rem;border:1px solid var(--line);border-radius:1rem}
  .addrow .scope:hover{color:var(--ink);border-color:var(--ink)}
  .addrow input[type=date]{color:var(--soft);font-size:.78rem;min-width:0;flex:1;color-scheme:light}
  body.dark .addrow input[type=date]{color-scheme:dark}
  .addrow .go{margin-left:auto;font-size:1.1rem;line-height:1;opacity:.6}
  .addrow .go:hover{opacity:1}

  /* column 4: palette, upcoming, music */
  .palette{text-align:left;font-size:.74rem;line-height:1.5;color:var(--soft);align-self:flex-start}
  .palette:hover{color:var(--ink)}
  .palette b{font-weight:400;color:var(--ink)}
  .up{margin-top:5vh}
  .up h3{font-weight:400;font-size:.95rem;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.7rem}
  .up h3 button{font-size:.72rem;color:var(--soft)}
  .up h3 button:hover{color:var(--ink)}
  .uprow{display:flex;gap:.9rem;padding:.4rem 0;border-top:1px solid var(--line);font-size:.88rem;line-height:1.3}
  .uprow:first-of-type{border-top:0}
  .uprow .when{flex:none;width:4.6rem;color:var(--soft)}
  .music{margin-top:auto}
  .music .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.6rem}
  .music .top button{font-size:.72rem;color:var(--soft)}
  .music .top button:hover{color:var(--ink)}
  .music iframe{display:block;width:100%;height:152px;border:0;border-radius:12px}
  .music input{width:100%;padding:.55rem 0;font-size:.9rem;border-bottom:1px solid var(--line)}
  .music input::placeholder{color:var(--soft)}
  .music .hint{font-size:.72rem;color:var(--soft);margin-top:.5rem;line-height:1.4}

  @media (max-width:900px){
    .stage{grid-template-columns:1fr 1.6fr;overflow:auto}
    .c3,.c4{display:none}
  }
</style>
</head>
<body>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

<div class="bg" id="bg">
  <div class="blur-field">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
  </div>
  <div class="wash"></div>
  <div class="grain"></div>
</div>

<nav class="rail" aria-label="Controls">
  <i class="pip"></i>
  <button id="btnPalette" aria-label="Change colors" title="Change colors (P)">
    <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
  </button>
  <button id="btnFocus" aria-label="Hide widgets" title="Hide widgets (F)">
    <svg viewBox="0 0 16 16"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M6 3v10"/></svg>
  </button>
  <button id="btnMusic" aria-label="Change music" title="Change music">
    <svg viewBox="0 0 16 16"><path d="M6 12V4l6-1.5V10"/><circle cx="4.5" cy="12" r="1.5"/><circle cx="10.5" cy="10" r="1.5"/></svg>
  </button>
</nav>

<main class="stage">
  <!-- 1 · year + calendar -->
  <section class="col c1">
    <div class="year" id="year"></div>
    <div class="cal">
      <div class="calhead">
        <span class="lbl" id="calLabel"></span>
        <span>
          <button id="prev" aria-label="Previous month">&#8249;</button>
          <button id="next" aria-label="Next month">&#8250;</button>
        </span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <!-- 2 · clock + date -->
  <section class="col c2">
    <div class="clock" id="clock" aria-live="off"></div>
    <div class="datestamp">
      <span id="dow"></span><span class="sep">&middot;</span><span id="daymonth"></span>
    </div>
  </section>

  <!-- 3 · to-do -->
  <section class="col c3">
    <div class="todo-head"><h2 style="font-weight:400;font-size:.95rem">To-do</h2><span class="lbl" id="count"></span></div>
    <div class="tabs" role="tablist" id="tabs">
      <button data-tab="today">Today</button>
      <button data-tab="week">Week</button>
      <button data-tab="month">Month</button>
      <button data-tab="all">All</button>
    </div>
    <div class="list" id="list"></div>
    <div class="add">
      <input class="txt" id="newText" type="text" placeholder="Add a task and press Enter" autocomplete="off" aria-label="New task">
      <div class="addrow">
        <button class="scope" id="scopeBtn" title="Click to change when this task is for">Today</button>
        <input type="date" id="newDue" aria-label="Due date">
        <button class="go" id="addBtn" aria-label="Add task">+</button>
      </div>
    </div>
  </section>

  <!-- 4 · palette, upcoming, music -->
  <section class="col c4">
    <button class="palette" id="palette" title="Click to change colors"></button>
    <div class="up" id="up"></div>
    <div class="music" id="music"></div>
  </section>
</main>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const store = {
    get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };
  const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const parse = s => new Date(s+"T00:00:00");
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  /* ---------- grain texture ---------- */
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>";
  document.documentElement.style.setProperty("--grain","url(\"data:image/svg+xml,"+encodeURIComponent(svg)+"\")");

  /* ---------- palettes (one per month by default) ---------- */
  const PALETTES = [
    {name:"Ink & Rust",     hex:"#B5502E", mood:"Focused start to the week", base:"#20242B", c1:"#B5502E", c2:"#2E3540", c3:"#6B7280", ink:"#F3EFE8", dark:1},
    {name:"Moss & Bone",    hex:"#4B6350", mood:"Steady, grounded",          base:"#EDE7D9", c1:"#4B6350", c2:"#F7F3E8", c3:"#C9AE7C", ink:"#20281F"},
    {name:"Plum & Copper",  hex:"#8C5A73", mood:"Warm, unhurried",           base:"#241A20", c1:"#8C5A73", c2:"#33252C", c3:"#C97B4A", ink:"#F2E8EA", dark:1},
    {name:"Chalk & Teal",   hex:"#2E7C74", mood:"Clear-headed",              base:"#EFF2EE", c1:"#2E7C74", c2:"#F8FAF6", c3:"#B7C4B0", ink:"#122421"},
    {name:"Slate & Gold",   hex:"#C9A24B", mood:"Deliberate, patient",       base:"#1D2126", c1:"#C9A24B", c2:"#2B313A", c3:"#57708A", ink:"#F1ECDC", dark:1},
    {name:"Clay & Sky",     hex:"#C97452", mood:"Open, low-effort",          base:"#F1E4D6", c1:"#C97452", c2:"#FAF3EA", c3:"#7FA8C9", ink:"#2A1E16"},
    {name:"Pine & Ember",   hex:"#D9663B", mood:"Restless energy, push week", base:"#182420", c1:"#D9663B", c2:"#22322C", c3:"#3F8F6B", ink:"#F2ECE2", dark:1},
    {name:"Linen & Ink",    hex:"#3D4A5C", mood:"Quiet reset",               base:"#F4F1EA", c1:"#3D4A5C", c2:"#FAF8F2", c3:"#A9997E", ink:"#1B1E22"}
  ];
  function isoWeek(d){
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = (t.getUTCDay()+6)%7;
    t.setUTCDate(t.getUTCDate()-day+3);
    const firstThu = new Date(Date.UTC(t.getUTCFullYear(),0,4));
    return 1 + Math.round((t-firstThu)/(7*864e5));
  }
  let weekKey = isoWeek(new Date()) + "-" + new Date().getFullYear();
  let palIdx = isoWeek(new Date()) % PALETTES.length;
  const manualPal = store.get("dash.pal.manual", null);
  const manualWeek = store.get("dash.pal.week", null);
  if (manualPal!=null && manualWeek===weekKey) palIdx = manualPal;

  function paintPalette(){
    const p = PALETTES[palIdx], r = document.documentElement.style;
    r.setProperty("--base",p.base); r.setProperty("--c1",p.c1); r.setProperty("--c2",p.c2);
    r.setProperty("--c3",p.c3);   r.setProperty("--ink",p.ink);
    document.body.classList.toggle("dark", !!p.dark);
    $("#palette").innerHTML = "<b></b><br><span></span><br><span></span>";
    const s = $("#palette").children;
    s[0].textContent = p.name; s[2].textContent = p.hex; s[4].textContent = p.mood;
  }
  function cyclePalette(){
    const bg = $("#bg");
    bg.style.opacity = 0;
    setTimeout(()=>{
      palIdx = (palIdx+1) % PALETTES.length;
      store.set("dash.pal.manual", palIdx);
      store.set("dash.pal.week", weekKey);
      paintPalette();
      bg.style.opacity = 1;
    }, 420);
  }

  /* ---------- data ---------- */
  const seed = [
    {id:uid(), text:"IELTS Reading and Listening practice", done:false, scope:"today", due:"2026-09-30"},
    {id:uid(), text:"Memorize NumPy and Colab commands",     done:false, scope:"week",  due:"2026-10-01"},
    {id:uid(), text:"Leave for Informatics test at 06:50",   done:false, scope:"week",  due:"2026-10-01"},
    {id:uid(), text:"Informatics test at 10:00",             done:false, scope:"week",  due:"2026-10-01"},
    {id:uid(), text:"IELTS Writing and Speaking practice",   done:false, scope:"week",  due:"2026-10-02"},
    {id:uid(), text:"IELTS test",                            done:false, scope:"week",  due:"2026-10-03"}
  ];
  let tasks = store.get("dash.tasks", null) || seed;
  const save = () => store.set("dash.tasks", tasks);

  let tab = store.get("dash.tab","all");
  let scopeNew = "today";
  const SCOPES = ["today","week","month"];
  const cap = s => s[0].toUpperCase()+s.slice(1);
  let selDay = null;
  let curDay = iso(new Date());
  let view = {y:new Date().getFullYear(), m:new Date().getMonth()};

  const rel = s => {
    const t = parse(iso(new Date())), d = parse(s);
    const diff = Math.round((d-t)/864e5);
    if (diff===0) return "Today";
    if (diff===1) return "Tomorrow";
    return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
  };

  /* ---------- date + clock ---------- */
  function renderDate(){
    const d = new Date();
    $("#year").textContent = d.getFullYear();
    $("#dow").textContent  = d.toLocaleDateString("en-GB",{weekday:"long"});
    $("#daymonth").textContent = d.toLocaleDateString("en-GB",{day:"numeric",month:"long"});
  }
  function tick(){
    const d = new Date(), p = n => String(n).padStart(2,"0");
    $("#clock").innerHTML = p(d.getHours())+":"+p(d.getMinutes())+"<small>"+p(d.getSeconds())+"</small>";
    if (iso(d)!==curDay){
      curDay = iso(d);
      view = {y:d.getFullYear(), m:d.getMonth()};
      renderDate(); renderCal(); renderUp(); renderTasks();
    }
  }

  /* ---------- calendar ---------- */
  function renderCal(){
    const {y,m} = view, todayISO = iso(new Date());
    const off = (new Date(y,m,1).getDay()+6)%7, dim = new Date(y,m+1,0).getDate();
    const dots = new Set(tasks.filter(t=>t.due && !t.done).map(t=>t.due));
    const g = $("#grid"); g.innerHTML = "";
    "MTWTFSS".split("").forEach(l=>{ const s=document.createElement("span"); s.className="wd"; s.textContent=l; g.append(s); });
    for (let i=0;i<off;i++) g.append(document.createElement("span"));
    for (let d=1; d<=dim; d++){
      const id = iso(new Date(y,m,d)), b = document.createElement("button");
      b.textContent = d;
      b.className = "day"+(id===todayISO?" today":"")+(id===selDay?" sel":"")+(dots.has(id)?" has":"");
      b.setAttribute("aria-label", parse(id).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}));
      b.onclick = () => { selDay = selDay===id ? null : id; $("#newDue").value = selDay||""; renderCal(); renderUp(); };
      g.append(b);
    }
    $("#calLabel").textContent = new Date(y,m,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  }
  $("#prev").onclick = () => { view.m--; if(view.m<0){view.m=11;view.y--;} renderCal(); };
  $("#next").onclick = () => { view.m++; if(view.m>11){view.m=0;view.y++;} renderCal(); };

  /* ---------- to-do ---------- */
  function renderTasks(){
    document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
    const shown = tasks.filter(t => tab==="all" || t.scope===tab)
      .sort((a,b)=> (a.done-b.done) || (a.due||"9999").localeCompare(b.due||"9999"));
    const list = $("#list"); list.innerHTML = "";
    if (!shown.length){
      const e = document.createElement("div"); e.className="empty";
      e.textContent = tab==="all" ? "No tasks yet. Add your first one below." : "Nothing planned for this "+(tab==="today"?"day":tab)+".";
      list.append(e);
    }
    shown.forEach(t=>{
      const row = document.createElement("div"); row.className = "item"+(t.done?" done":"");
      const chk = document.createElement("button"); chk.className="chk";
      chk.setAttribute("aria-label", (t.done?"Mark not done: ":"Mark done: ")+t.text);
      chk.onclick = () => { t.done=!t.done; save(); renderTasks(); renderUp(); renderCal(); };
      const body = document.createElement("div"); body.className="body";
      body.append(document.createTextNode(t.text));
      const meta = [];
      if (tab==="all") meta.push(cap(t.scope));
      if (t.due) meta.push(rel(t.due));
      if (meta.length){ const m=document.createElement("span"); m.className="meta"; m.textContent=meta.join(", "); body.append(m); }
      const del = document.createElement("button"); del.className="del"; del.textContent="\u00d7";
      del.setAttribute("aria-label","Delete task: "+t.text);
      del.onclick = () => { tasks = tasks.filter(x=>x.id!==t.id); save(); renderTasks(); renderUp(); renderCal(); };
      row.append(chk, body, del); list.append(row);
    });
    const open = tasks.filter(t=>!t.done && (tab==="all"||t.scope===tab)).length;
    $("#count").textContent = open+" open";
  }
  function addTask(){
    const inp = $("#newText"), text = inp.value.trim();
    if (!text) return;
    tasks.push({id:uid(), text, done:false, scope:scopeNew, due:$("#newDue").value||null});
    save(); inp.value = "";
    if (tab!=="all" && tab!==scopeNew) tab = scopeNew;
    renderTasks(); renderUp(); renderCal();
  }
  $("#newText").addEventListener("keydown", e => { if(e.key==="Enter") addTask(); });
  $("#addBtn").onclick = addTask;
  $("#scopeBtn").onclick = () => {
    scopeNew = SCOPES[(SCOPES.indexOf(scopeNew)+1)%SCOPES.length];
    $("#scopeBtn").textContent = cap(scopeNew);
  };
  $("#tabs").onclick = e => {
    const b = e.target.closest("button"); if(!b) return;
    tab = b.dataset.tab; store.set("dash.tab",tab);
    if (tab!=="all"){ scopeNew = tab; $("#scopeBtn").textContent = cap(tab); }
    renderTasks();
  };

  /* ---------- upcoming ---------- */
  function renderUp(){
    const todayISO = iso(new Date());
    let items = tasks.filter(t=>t.due && !t.done);
    items = selDay ? items.filter(t=>t.due===selDay) : items.filter(t=>t.due>=todayISO);
    items.sort((a,b)=>a.due.localeCompare(b.due));
    items = items.slice(0,4);
    const box = $("#up"); box.innerHTML = "";
    const h = document.createElement("h3");
    const title = document.createElement("span");
    title.textContent = selDay ? parse(selDay).toLocaleDateString("en-GB",{day:"numeric",month:"long"}) : "Upcoming";
    h.append(title);
    if (selDay){ const c=document.createElement("button"); c.textContent="Show all"; c.onclick=()=>{selDay=null;$("#newDue").value="";renderCal();renderUp();}; h.append(c); }
    box.append(h);
    if (!items.length){ const e=document.createElement("div"); e.className="empty"; e.textContent = selDay?"Nothing on this day.":"Nothing scheduled. Give a task a date to see it here."; box.append(e); return; }
    items.forEach(t=>{
      const r=document.createElement("div"); r.className="uprow";
      const w=document.createElement("span"); w.className="when"; w.textContent=rel(t.due);
      const x=document.createElement("span"); x.textContent=t.text;
      r.append(w,x); box.append(r);
    });
  }

  /* ---------- music (Spotify embed) ---------- */
  function embedUrl(u){
    const m = (u||"").match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist|episode|show|artist)\/([A-Za-z0-9]+)/);
    return m ? "https://open.spotify.com/embed/"+m[1]+"/"+m[2]+"?utm_source=generator" : null;
  }
  function renderMusic(){
    const url = store.get("dash.music", null), box = $("#music"); box.innerHTML = "";
    const top = document.createElement("div"); top.className="top";
    const t = document.createElement("span"); t.textContent = "Music"; t.style.fontWeight = 400; t.style.fontSize = ".95rem";
    top.append(t);
    if (url){
      const c = document.createElement("button"); c.textContent="Change"; c.onclick=()=>{ store.set("dash.music",null); renderMusic(); setTimeout(()=>{const i=$("#music input"); i&&i.focus();},0); };
      top.append(c); box.append(top);
      const f = document.createElement("iframe");
      f.src = url; f.title = "Spotify player"; f.loading = "lazy";
      f.allow = "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
      box.append(f);
    } else {
      box.append(top);
      const i = document.createElement("input");
      i.type="text"; i.placeholder="Paste a Spotify link and press Enter"; i.setAttribute("aria-label","Spotify link");
      i.addEventListener("keydown", e => {
        if (e.key!=="Enter") return;
        const emb = embedUrl(i.value);
        if (emb){ store.set("dash.music", emb); renderMusic(); }
        else { hint.textContent = "That doesn't look like a Spotify link. Copy one from Share in Spotify."; }
      });
      const hint = document.createElement("div"); hint.className="hint";
      hint.textContent = "Works with playlists, albums, tracks and podcasts.";
      box.append(i, hint);
    }
  }

  /* ---------- rail + keys ---------- */
  $("#palette").onclick = cyclePalette;
  $("#btnPalette").onclick = cyclePalette;
  $("#btnFocus").onclick = () => { document.body.classList.toggle("focus"); $("#btnFocus").classList.toggle("on"); };
  $("#btnMusic").onclick = () => { store.set("dash.music",null); renderMusic(); setTimeout(()=>{const i=$("#music input"); i&&i.focus();},0); };
  document.addEventListener("keydown", e => {
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (e.key==="p"||e.key==="P") cyclePalette();
    if (e.key==="f"||e.key==="F") $("#btnFocus").click();
    if (e.key==="Escape" && selDay){ selDay=null; $("#newDue").value=""; renderCal(); renderUp(); }
  });

  /* ---------- cursor ---------- */
  (function(){
    const glow = $("#cursorGlow"), bg = $("#bg");
    const interactiveSel = "button, a, input, .day, .item, .uprow, [role='tab']";
    let raf = null, tx = innerWidth/2, ty = innerHeight*.38, cx = tx, cy = ty;
    function loop(){
      cx += (tx-cx)*.45; cy += (ty-cy)*.45;
      glow.style.transform = "translate("+cx+"px,"+cy+"px)";
      bg.style.setProperty("--mx", (cx/innerWidth*100)+"%");
      bg.style.setProperty("--my", (cy/innerHeight*100)+"%");
      raf = requestAnimationFrame(loop);
    }
    addEventListener("pointermove", e => {
      tx = e.clientX; ty = e.clientY;
      glow.classList.toggle("hover", !!e.target.closest(interactiveSel));
    }, {passive:true});
    addEventListener("pointerdown", () => glow.classList.add("down"), {passive:true});
    addEventListener("pointerup",   () => glow.classList.remove("down"), {passive:true});
    addEventListener("pointerleave", () => glow.style.opacity = 0, {passive:true});
    addEventListener("pointerenter", () => glow.style.opacity = "", {passive:true});
    loop();
  })();

  /* ---------- go ---------- */
  paintPalette(); renderDate(); renderCal(); renderTasks(); renderUp(); renderMusic();
  $("#scopeBtn").textContent = cap(scopeNew);
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
